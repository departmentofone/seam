[workspace]
resolver = "2"
members = ["core", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Department of One"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
